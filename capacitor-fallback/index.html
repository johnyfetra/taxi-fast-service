<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taxi Fast Service</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fff;
      color: #0D0D0F;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }
    img { width: 200px; max-width: 80%; margin-bottom: 2rem; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    p { color: #666; margin-bottom: 1.5rem; font-size: 0.95rem; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #eee;
      border-top-color: #D81F26;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <img src="logo-transparent.png" alt="Taxi Fast Service" onerror="this.style.display='none'">
  <h1>Taxi Fast Service</h1>
  <p>Connexion en cours…</p>
  <div class="spinner"></div>
  <script>
    // Auto-redirect when online
    function tryConnect() {
      if (navigator.onLine) {
        location.href = 'https://taxi-fast-service.vercel.app/commander';
      }
    }
    window.addEventListener('online', tryConnect);
    tryConnect();
  </script>
</body>
</html>
