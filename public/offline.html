<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hors ligne — Taxi Fast Service</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fff;
      color: #0D0D0F;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }
    img { width: 180px; max-width: 75%; margin-bottom: 2rem; }
    h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.75rem; }
    p { color: #666; font-size: 0.9rem; line-height: 1.5; margin-bottom: 1.5rem; }
    button {
      background: #D81F26;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.75rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:active { opacity: 0.85; }
  </style>
</head>
<body>
  <img src="/logo-transparent.png" alt="Taxi Fast Service">
  <h1>Pas de connexion</h1>
  <p>Vérifiez votre connexion internet et réessayez.<br>L'application nécessite une connexion pour fonctionner.</p>
  <button onclick="location.reload()">Réessayer</button>
  <script>
    window.addEventListener('online', () => location.reload());
  </script>
</body>
</html>
